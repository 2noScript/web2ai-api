[package]
name = "unofficial-api-desktop"
version = "0.1.0"
description = "Unofficial API Gateway Desktop Application"
authors = ["Unofficial API"]
edition = "2021"

[lib]
name = "unofficial_api_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
diesel = { version = "2", default-features = false, features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
wasmi = "0.40"
wreq = { version = "6.0.0-rc.31", features = ["json", "cookies", "stream", "gzip", "brotli", "deflate"] }
wreq-util = "3.0.0-rc.14"
