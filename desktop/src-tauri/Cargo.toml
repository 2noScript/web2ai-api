[package]
name = "web2ai-desktop"
version = "0.1.6"
description = "Web2AI API Desktop Application"
authors = ["Web2AI"]
edition = "2021"
default-run = "web2ai"

[[bin]]
name = "web2ai"
path = "src/main.rs"

[lib]
name = "web2ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
diesel = { version = "2", default-features = false, features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
wasmtime = { version = "29", default-features = false, features = ["cranelift", "runtime"] }
wreq = { version = "6.0.0-rc.31", features = ["json", "cookies", "stream", "gzip", "brotli", "deflate", "multipart", "ws"] }
wreq-util = "3.0.0-rc.14"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"
tokio-stream = "0.1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
regex = "1"
jsonrepair-rs = "0.2.7"
jsonschema = { version = "0.63", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Keep local build artifacts small while preserving source locations in backtraces.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
