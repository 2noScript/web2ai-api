services:
  unofficial-api:
    build: .
    image: 2noscript/unofficial-api:latest
    container_name: unofficial-api
    ports:
      - "8088:8088"
    env_file:
      - .env
    environment:
      - UNOFFICIAL_API_DATA_DIR=/data
      - LIGHTPANDA_CDP_URL=ws://lightpanda:9222
    volumes:
      - ./data:/data
    depends_on:
      - lightpanda
    restart: unless-stopped

  lightpanda:
    image: lightpanda/browser:nightly
    container_name: lightpanda-browser
    ports:
      - "127.0.0.1:9222:9222"
    restart: unless-stopped
