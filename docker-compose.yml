services:
  unofficial-api:
    build: .
    image: 2noscript/unofficial-api:latest
    container_name: unofficial-api
    ports:
      - "8088:8088"
    env_file:
      - .env
    environment:
      - UNOFFICIAL_API_DATA_DIR=/data
      - LIGHTPANDA_CDP_URL=ws://host.docker.internal:9222
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    restart: unless-stopped
