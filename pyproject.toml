[project]
name = "unofficial-api"
version = "0.1.0"
description = "Unified OpenAI-compatible API Gateway for DeepSeek, Gemini, and Meta AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.9.0",
    "curl-cffi>=0.15.0",
    "deepseek-api",
    "gemini-webapi",
    "metaai-api",
    "fastapi[standard]>=0.138.0",
    "loguru>=0.7.3",
    "lxml-html-clean>=0.1.1",
    "orjson>=3.11.7",
    "python-multipart>=0.0.21",
    "requests>=2.34.2",
    "requests-html>=0.10.0",
    "wasmtime>=45.0.0",
    "websockets>=10.0",
    "playwright>=1.40.0",
]

[tool.uv.sources]
deepseek-api = { path = "deepseek-api", editable = true }
gemini-webapi = { path = "Gemini-API", editable = true }
metaai-api = { path = "metaai-api", editable = true }

# How SDKs are included:
#   sys.path in server.py: DeepSeek (deepseek-api/), Gemini (Gemini-API/src/), Meta AI (metaai-api/)
[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
]

[tool.pyright]
extraPaths = [
    "deepseek-api",
    "Gemini-API/src",
    "metaai-api",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
